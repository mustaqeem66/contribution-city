name: Generate Contribution City

on:
  schedule:
    - cron: "0 18 * * *"  # 매일 03:00 KST (18:00 UTC)
  workflow_dispatch:  # 수동 실행 가능

permissions:
  contents: write

jobs:
  build:
    if: github.repository != 'mna11/contribution-city'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Generate contribution graphs
        run: node generate-city.js && node gitcity.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
          THEME: aurora

      - name: Commit & Push
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          git config user.name github-actions
          git config user.email github-actions[bot]@users.noreply.github.com
          git add -A .
          if git commit -m "🏙️ Update contribution city" ; then
            git push origin "HEAD:$REF_NAME"
          fi